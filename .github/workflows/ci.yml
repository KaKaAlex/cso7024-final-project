name: Northwind CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  build-test-container:
    name: Build, test and containerise
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Check Python source
        run: python -m compileall app

      - name: Run automated tests
        run: python -m pytest -v

      - name: Build container image
        run: docker build -t northwind-delivery:${{ github.sha }} .

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Publish container image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker tag northwind-delivery:${{ github.sha }} ghcr.io/kakaalex/cso7024-final-project:${{ github.sha }}
          docker tag northwind-delivery:${{ github.sha }} ghcr.io/kakaalex/cso7024-final-project:latest
          docker push ghcr.io/kakaalex/cso7024-final-project:${{ github.sha }}
          docker push ghcr.io/kakaalex/cso7024-final-project:latest